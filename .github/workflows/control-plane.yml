name: Validate repository control plane

on:
  push:
    branches: [ main ]
    paths:
      - "pytest.ini"
      - "project-state.json"
      - "tests/**"
      - "scripts/source_citations.py"
      - "scripts/source_db.py"
      - "scripts/validate_project_state.py"
      - "scripts/validate_documentation_state.py"
      - "scripts/validate_surface_closure.py"
      - "scripts/check_remainder_localization.py"
      - "scripts/surface_remainder*.py"
      - "scripts/validate_run_manifests.py"
      - "scripts/run_manifest_guard_ci.sh"
      - "scripts/freeze_run_manifest_debt_baseline.py"
      - "scripts/validate_changed_run_coverage.py"
      - "scripts/audit_v88_sanitation.py"
      - "scripts/**transcript*.txt"
      - "scripts/**output*.txt"
      - "scripts/test_monotone_nodes.py"
      - "scripts/cascade*.py"
      - "run-manifests/**"
      - ".github/run-manifest-debt-baseline.json"
      - ".github/run-manifest-debt-baseline.hashes.json"
      - ".github/scientific-test-triage.json"
      - "scripts/pytest_scientific_triage_guard.py"
      - "tests/scientific_test_triage_guard_adversarial.py"
      - "audit/SCIENTIFIC-TEST-TRIAGE-20260802.md"
      - "docs/PROJECT-STATE.md"
      - "docs/SURFACE-CLOSURE-GATES.md"
      - "docs/SURFACE-REMAINDER-PREREG.md"
      - "README.md"
      - "CURRENT-STATE.md"
      - "ROADMAP.md"
      - "HORIZON.md"
      - "HYPOTHESIS_FRONTIER.md"
      - "README-FOR-NEXT-MODEL.md"
      - "SATELLITES.md"
      - "docs/dashboard/**"
      - "docs/incidents/**"
      - "docs/source-citations/**"
      - "docs/source-db/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "pytest.ini"
      - "project-state.json"
      - "tests/**"
      - "scripts/source_citations.py"
      - "scripts/source_db.py"
      - "scripts/validate_project_state.py"
      - "scripts/validate_documentation_state.py"
      - "scripts/validate_surface_closure.py"
      - "scripts/check_remainder_localization.py"
      - "scripts/surface_remainder*.py"
      - "scripts/validate_run_manifests.py"
      - "scripts/run_manifest_guard_ci.sh"
      - "scripts/freeze_run_manifest_debt_baseline.py"
      - "scripts/validate_changed_run_coverage.py"
      - "scripts/audit_v88_sanitation.py"
      - "scripts/**transcript*.txt"
      - "scripts/**output*.txt"
      - "scripts/test_monotone_nodes.py"
      - "scripts/cascade*.py"
      - "run-manifests/**"
      - ".github/run-manifest-debt-baseline.json"
      - ".github/run-manifest-debt-baseline.hashes.json"
      - ".github/scientific-test-triage.json"
      - "scripts/pytest_scientific_triage_guard.py"
      - "tests/scientific_test_triage_guard_adversarial.py"
      - "audit/SCIENTIFIC-TEST-TRIAGE-20260802.md"
      - "docs/PROJECT-STATE.md"
      - "docs/SURFACE-CLOSURE-GATES.md"
      - "docs/SURFACE-REMAINDER-PREREG.md"
      - "README.md"
      - "CURRENT-STATE.md"
      - "ROADMAP.md"
      - "HORIZON.md"
      - "HYPOTHESIS_FRONTIER.md"
      - "README-FOR-NEXT-MODEL.md"
      - "SATELLITES.md"
      - "docs/dashboard/**"
      - "docs/incidents/**"
      - "docs/source-citations/**"
      - "docs/source-db/**"
      - ".github/workflows/control-plane.yml"

jobs:
  run-manifest-structure-debt-delta:
    name: Run-manifest structure and historical-debt delta
    runs-on: ubuntu-latest
    steps:
      - name: Invalidate any pre-existing run-manifest decision record
        shell: bash
        run: |
          rm -f -- "$GITHUB_WORKSPACE/run-manifest-guard-result.json"
          test ! -e "$GITHUB_WORKSPACE/run-manifest-guard-result.json"

      - uses: actions/checkout@v4
        with:
          # Source metadata records historical commit anchors.  A shallow
          # checkout turns valid ancestors into false "missing" results.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exercise run-manifest debt guard under normal and optimized Python
        run: |
          python tests/run_manifest_guard_adversarial.py
          python -O tests/run_manifest_guard_adversarial.py
          python tests/run_manifest_workflow_adversarial.py

      - name: Guard run-manifest structure and historical-debt delta
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/run_manifest_guard_ci.sh \
            "$GITHUB_WORKSPACE/run-manifest-guard-result.json" \
            "$RUNNER_TEMP/run-manifest-comparison" \
            "$CHANGE_BASE"

      - name: Publish run-manifest guard decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-guard-result
          path: run-manifest-guard-result.json
          if-no-files-found: error

  test:
    name: "Scientific pytest triage: repairable-debt ratchet (5) + declared evidence-loss set (4)"
    runs-on: ubuntu-latest
    steps:
      - name: Invalidate any pre-existing scientific-test triage decision
        shell: bash
        run: |
          rm -f -- "$GITHUB_WORKSPACE/scientific-test-triage-decision.json"
          test ! -e "$GITHUB_WORKSPACE/scientific-test-triage-decision.json"

      - uses: actions/checkout@v4
        with:
          # Source metadata records historical commit anchors.  A shallow
          # checkout turns valid ancestors into false "missing" results.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and certificate runtime
        run: >-
          python -m pip install pytest sympy==1.14.0 mpmath==1.3.0
          python-flint==0.9.0

      - name: Require manifests for changed computational artifacts
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/validate_changed_run_coverage.py
          --base "$CHANGE_BASE" --head "$CHANGE_HEAD"

      - name: Validate canonical project state
        run: python scripts/validate_project_state.py

      - name: Validate public documentation state
        run: python scripts/validate_documentation_state.py

      - name: Validate Surface Theorem closure gates
        run: python scripts/validate_surface_closure.py

      - name: Validate Surface remainder localization L0
        run: python scripts/check_remainder_localization.py

      - name: Audit committed v88 sanitation evidence
        run: python scripts/audit_v88_sanitation.py

      - name: Exercise scientific-test triage attacks
        run: |
          python tests/scientific_test_triage_guard_adversarial.py
          python -O tests/scientific_test_triage_guard_adversarial.py

      - name: Run pytest with classified evidence-loss and repairable-debt guard
        env:
          # A synchronize event carries the prior PR head in `before`, which
          # makes a repair ratchet immediately.  Opened PRs fall back to the
          # exact base-branch SHA; pushes also carry their prior head.
          CHANGE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: >-
          python scripts/pytest_scientific_triage_guard.py
          --manifest .github/scientific-test-triage.json
          --result scientific-test-triage-decision.json
          --comparison-base "$CHANGE_BASE"

      - name: Publish scientific-test triage decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-test-triage-decision
          path: scientific-test-triage-decision.json
          if-no-files-found: error
