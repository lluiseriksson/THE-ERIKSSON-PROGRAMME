name: Validate Step 8b.23 Units A-E

on:
  workflow_dispatch:
    inputs:
      cold:
        description: Require a cold checkout without project-graph restoration
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SOURCE_SHA: 36eebd5aa99db0063f22081bda0f58da01359e2f
  EXPECTED_MATHLIB: 07642720480157414db592fa85b626dafb71355b
  TOOLCHAIN_URL: https://github.com/leanprover/lean4/releases/download/v4.29.0-rc6/lean-4.29.0-rc6-linux.tar.zst
  TOOLCHAIN_SHA256: bf3e0a4025e47a0bea9ed907d12dcccd3d3590b1d8ad6c55a915298b01ad9d3e

jobs:
  step8b23-ae:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require cold terminal mode
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.cold }}' = 'true'

      - name: Checkout exact source checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact source checkpoint and 36 blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          actual="$(git rev-parse HEAD)"
          printf 'SOURCE_SHA=%s\nACTUAL_HEAD=%s\nWORKFLOW_SHA=%s\nCOLD_MODE=%s\n' \
            "$SOURCE_SHA" "$actual" "$GITHUB_SHA" '${{ inputs.cold }}' | \
            tee evidence/checkpoint.txt
          test "$actual" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.29.0-rc6"
          cat > evidence/source-blobs.sha256 <<'SOURCE_BLOBS'
          c266423f68421b5ba771140586d458ef53d766831fb06d12a879ce25ae3e9853  YangMills/RG/BalabanCMP89CenteredBrillouinAffineSlice.lean
          0bb147baf82707e0de48a3ce888b968c005d9584b9bae6d14a5d9cac012a23c2  YangMills/RG/BalabanCMP89CenteredBrillouinAffineSliceAudit.lean
          1bd9c2c0660a0b7a9eb94e1c7867028ed7c4278210317cbf8cdd674e1d720bc7  YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotient.lean
          8a14bdda0ea10e74d3bc59b0ee183aea477490b6acef6880dbc2dca62802bb75  YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotientAudit.lean
          b7c58f3becacd65e0c4a1a4387804574eb1c74d0284547c8bf8d09453da03a0c  YangMills/RG/BalabanCMP89CenteredTorusFourierPhase.lean
          246ef491a33109859d1f4e0a7889eb1f209a2a363e4001717d0e0dc6e67eea88  YangMills/RG/BalabanCMP89CenteredTorusFourierPhaseAudit.lean
          f307d1e00de4f1ac64a08639b533c2df2bba2bc558209f877cbc3f04fc916e11  YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasure.lean
          35db023192efabc07380ebf0299eb1c07245be4e16e201e14e11ea5f201b38e8  YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasureAudit.lean
          05ebd095ba003fd2872f09c60cff0c36cd68e7a8ffdd0f55009179cf30729d6b  YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphy.lean
          2510acfc6f38f7c45ee669d93f58795214a6725ccbe9fe9e77dbf52fb5711cec  YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphyAudit.lean
          b6ed5793f44b3de83f77747a46daccd32f9fe45ba0dd4d466c93a525f6d9c7dc  YangMills/RG/BalabanCMP89Eq248DisplayedGreenVectorPeriodicity.lean
          0ec7924267e39b7712b348902bdd4e69b29cb64ca5ca22dab0d77a128ee1ff2e  YangMills/RG/BalabanCMP89Eq248DisplayedGreenVectorPeriodicityAudit.lean
          e69480f49800acf6d3eb575e2bdf4303590afac5af0dfd57465e5189e222e7a6  YangMills/RG/BalabanCMP89Eq248CenteredGreenTorus.lean
          e698677b04e71a36f3783b58db1f37e1cb84a89e69b9cb28805e589210f0efc0  YangMills/RG/BalabanCMP89Eq248CenteredGreenTorusAudit.lean
          53785e1695c34c91b750527baded4271d2abe9469109762c7ac08ba2edb4dd4b  YangMills/RG/BalabanCMP99CenteredTorusSampleDictionary.lean
          ee9d5c4d19309a5586465d6c650e3602397a2e7372c74da55a6d845d02ad96ce  YangMills/RG/BalabanCMP99CenteredTorusSampleDictionaryAudit.lean
          cd6a76a96b75fdd79cd67d889ff92b45bef4dfc66b98e6fe831a295986779d61  YangMills/RG/BalabanCMP99CenteredTorusPhysicalGreenSampleTransport.lean
          ebbc79a2c206e04c9b290c096590a2456cc8eab293bccdcf6db27ccddd3767a8  YangMills/RG/BalabanCMP99CenteredTorusPhysicalGreenSampleTransportAudit.lean
          325588d8280e99f2c45858f045b952064639fc24341afca6f049a485dfd6ba6d  YangMills/RG/BalabanCMP89Eq248GreenOneCoordinateContourShift.lean
          4a2349c526da39442794b7dc75a30ca5f45ca2b9faf33a5f190e98882aceab60  YangMills/RG/BalabanCMP89Eq248GreenOneCoordinateContourShiftAudit.lean
          cfe37312d6db0cce864e33a9b620f6664e04e52e7947c0cfc5dc3b488186cf3b  YangMills/RG/BalabanCMP89Eq248GreenProductContourTelescope.lean
          2bf1ecedd087092acdb914e64ba0979d2de654febe36fb69c09f29b4d305f171  YangMills/RG/BalabanCMP89Eq248GreenProductContourTelescopeAudit.lean
          a07c32e7d21d165355c0b2f3dde635d2251f04401a8239ff7ff9c17243498a52  YangMills/RG/BalabanCMP89Eq248MassUniformGreenBound.lean
          83fb7dfc26b7e21800465b0a04d53de838b2b76feda52ed4f14bccff438768ff  YangMills/RG/BalabanCMP89Eq248MassUniformGreenBoundAudit.lean
          c365329ba58e7cb69b59a16dae62f32e69bc1c3d8e12cedd3cdd2d7665077781  YangMills/RG/BalabanCMP89Eq248MassUniformNormalizedGreenBound.lean
          7604d1727e8168662806efc6d82470c953cd42443b02705183bea1980790626b  YangMills/RG/BalabanCMP89Eq248MassUniformNormalizedGreenBoundAudit.lean
          9fd51d9136ffa446d414fd36f509576bd03fa4081d695f6cb6bda2b691b44ab4  YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientPhase.lean
          613507fd729af2fdb242eeb9a7414286e9de080c893cf0c4ea87b58096f26908  YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientPhaseAudit.lean
          53c005aeb97d187a91f4509c91daf9bf448d9375a948e8528e33def1b42e79ef  YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientDictionary.lean
          ca78912c3c168b77daeffd69808fc72b84f31ca1db28d51477891a7d56794342  YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientDictionaryAudit.lean
          8ca777ceb2c7a29b2f9da85b5eb4e5d64e7de692ed3a34cccd923e9061dc06fb  YangMills/RG/BalabanCMP89SignedLatticeL1TotalSum.lean
          80bad23756e1a24508d84bb969cebe2dff18ea72bc938fa24b28ab911fb296fb  YangMills/RG/BalabanCMP89SignedLatticeL1TotalSumAudit.lean
          24e692d3a7660bcdc3183ffaa23c3a8b50454db98ce45a7e72e74c4f1e2d975b  YangMills/RG/BalabanCMP89CenteredGreenFourierSummability.lean
          e1ff97694e15ed9d0976b033a933a2d1d45bd87cfe7ae73c4efd930fd38de532  YangMills/RG/BalabanCMP89CenteredGreenFourierSummabilityAudit.lean
          6ee73253a553c064f4e1b5a37f4f59916f086381d2cbf59d2ab245d4dc459750  YangMills/RG/BalabanCMP99PhysicalGreenFiniteGridAliasing.lean
          f9efec45f5856ccc8a97ea5f0240e43c929a495122e58600d19e5a09cfabd643  YangMills/RG/BalabanCMP99PhysicalGreenFiniteGridAliasingAudit.lean
          SOURCE_BLOBS
          test "$(wc -l < evidence/source-blobs.sha256)" -eq 36
          while read -r expected path; do
            actual_blob="$(git cat-file blob "$SOURCE_SHA:$path" | sha256sum | cut -d' ' -f1)"
            test "$actual_blob" = "$expected"
          done < evidence/source-blobs.sha256

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          asset=/tmp/lean-4.29.0-rc6-linux.tar.zst
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$asset" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$TOOLCHAIN_SHA256" "$asset" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p /tmp/lean-toolchain
          tar --use-compress-program=unzstd -xf "$asset" -C /tmp/lean-toolchain
          bindir=/tmp/lean-toolchain/lean-4.29.0-rc6-linux/bin
          test -x "$bindir/lean"
          test -x "$bindir/lake"
          echo "$bindir" >> "$GITHUB_PATH"
          {
            printf 'TOOLCHAIN_URL=%s\nTOOLCHAIN_ASSET_SHA256=%s\n' \
              "$TOOLCHAIN_URL" "$TOOLCHAIN_SHA256"
            sha256sum "$bindir/lean" "$bindir/lake"
          } | tee evidence/toolchain.txt

      - name: Materialize pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee -a evidence/toolchain.txt
          lake --version | tee -a evidence/toolchain.txt
          manifest_before="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          toolchain_before="$(sha256sum lean-toolchain | cut -d' ' -f1)"
          lake update 2>&1 | tee evidence/lake-update.log
          test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "$manifest_before"
          test "$(sha256sum lean-toolchain | cut -d' ' -f1)" = "$toolchain_before"
          mathlib="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          printf 'MATHLIB_SHA=%s\n' "$mathlib" | tee evidence/mathlib.txt
          test "$mathlib" = "$EXPECTED_MATHLIB"
          lake exe cache get 2>&1 | tee evidence/cache-get.log

      - name: Run 18-brick focal and audit queue stop on first error
        shell: bash
        run: |
          set -euo pipefail
          awk '{print $2}' evidence/source-blobs.sha256 > evidence/overlay-paths.txt
          python scripts/check_lean_overlay_text.py \
            --paths-from evidence/overlay-paths.txt | tee evidence/text-guard.log
          mapfile -t overlay_paths < evidence/overlay-paths.txt
          python scripts/check_lean_import_prefix.py "${overlay_paths[@]}" | \
            tee evidence/import-prefix-guard.log
          run_stage() {
            local stage="$1"
            shift
            local started ended code
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'STAGE=%s STARTED=%s CMD=' "$stage" "$started" | tee -a evidence/stages.txt
            printf '%q ' "$@" | tee -a evidence/stages.txt
            printf '\n' | tee -a evidence/stages.txt
            set +e
            "$@" 2>&1 | tee "evidence/${stage}.log"
            code=${PIPESTATUS[0]}
            set -e
            ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'STAGE=%s EXIT=%s ENDED=%s\n' "$stage" "$code" "$ended" | \
              tee -a evidence/stages.txt
            test "$code" -eq 0
          }

          run_stage 01_cmp89centeredbrillouinaffineslice_focal lake build YangMills.RG.BalabanCMP89CenteredBrillouinAffineSlice
          run_stage 01_cmp89centeredbrillouinaffineslice_audit lake env lean YangMills/RG/BalabanCMP89CenteredBrillouinAffineSliceAudit.lean
          run_stage 02_cmp89centeredunitcubetorusquotient_focal lake build YangMills.RG.BalabanCMP89CenteredUnitCubeTorusQuotient
          run_stage 02_cmp89centeredunitcubetorusquotient_audit lake env lean YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotientAudit.lean
          run_stage 03_cmp89centeredtorusfourierphase_focal lake build YangMills.RG.BalabanCMP89CenteredTorusFourierPhase
          run_stage 03_cmp89centeredtorusfourierphase_audit lake env lean YangMills/RG/BalabanCMP89CenteredTorusFourierPhaseAudit.lean
          run_stage 04_cmp89normalizedbrillouintotorusmeasure_focal lake build YangMills.RG.BalabanCMP89NormalizedBrillouinToTorusMeasure
          run_stage 04_cmp89normalizedbrillouintotorusmeasure_audit lake env lean YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasureAudit.lean
          run_stage 05_cmp89eq248greenmassuniformholomorphy_focal lake build YangMills.RG.BalabanCMP89Eq248GreenMassUniformHolomorphy
          run_stage 05_cmp89eq248greenmassuniformholomorphy_audit lake env lean YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphyAudit.lean
          run_stage 06_cmp89eq248displayedgreenvectorperiodicity_focal lake build YangMills.RG.BalabanCMP89Eq248DisplayedGreenVectorPeriodicity
          run_stage 06_cmp89eq248displayedgreenvectorperiodicity_audit lake env lean YangMills/RG/BalabanCMP89Eq248DisplayedGreenVectorPeriodicityAudit.lean
          run_stage 07_cmp89eq248centeredgreentorus_focal lake build YangMills.RG.BalabanCMP89Eq248CenteredGreenTorus
          run_stage 07_cmp89eq248centeredgreentorus_audit lake env lean YangMills/RG/BalabanCMP89Eq248CenteredGreenTorusAudit.lean
          run_stage 08_cmp99centeredtorussampledictionary_focal lake build YangMills.RG.BalabanCMP99CenteredTorusSampleDictionary
          run_stage 08_cmp99centeredtorussampledictionary_audit lake env lean YangMills/RG/BalabanCMP99CenteredTorusSampleDictionaryAudit.lean
          run_stage 09_cmp99centeredtorusphysicalgreensampletransport_focal lake build YangMills.RG.BalabanCMP99CenteredTorusPhysicalGreenSampleTransport
          run_stage 09_cmp99centeredtorusphysicalgreensampletransport_audit lake env lean YangMills/RG/BalabanCMP99CenteredTorusPhysicalGreenSampleTransportAudit.lean
          run_stage 10_cmp89eq248greenonecoordinatecontourshift_focal lake build YangMills.RG.BalabanCMP89Eq248GreenOneCoordinateContourShift
          run_stage 10_cmp89eq248greenonecoordinatecontourshift_audit lake env lean YangMills/RG/BalabanCMP89Eq248GreenOneCoordinateContourShiftAudit.lean
          run_stage 11_cmp89eq248greenproductcontourtelescope_focal lake build YangMills.RG.BalabanCMP89Eq248GreenProductContourTelescope
          run_stage 11_cmp89eq248greenproductcontourtelescope_audit lake env lean YangMills/RG/BalabanCMP89Eq248GreenProductContourTelescopeAudit.lean
          run_stage 12_cmp89eq248massuniformgreenbound_focal lake build YangMills.RG.BalabanCMP89Eq248MassUniformGreenBound
          run_stage 12_cmp89eq248massuniformgreenbound_audit lake env lean YangMills/RG/BalabanCMP89Eq248MassUniformGreenBoundAudit.lean
          run_stage 13_cmp89eq248massuniformnormalizedgreenbound_focal lake build YangMills.RG.BalabanCMP89Eq248MassUniformNormalizedGreenBound
          run_stage 13_cmp89eq248massuniformnormalizedgreenbound_audit lake env lean YangMills/RG/BalabanCMP89Eq248MassUniformNormalizedGreenBoundAudit.lean
          run_stage 14_cmp89centeredtorusgreencoefficientphase_focal lake build YangMills.RG.BalabanCMP89CenteredTorusGreenCoefficientPhase
          run_stage 14_cmp89centeredtorusgreencoefficientphase_audit lake env lean YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientPhaseAudit.lean
          run_stage 15_cmp89centeredtorusgreencoefficientdictionary_focal lake build YangMills.RG.BalabanCMP89CenteredTorusGreenCoefficientDictionary
          run_stage 15_cmp89centeredtorusgreencoefficientdictionary_audit lake env lean YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientDictionaryAudit.lean
          run_stage 16_cmp89signedlatticel1totalsum_focal lake build YangMills.RG.BalabanCMP89SignedLatticeL1TotalSum
          run_stage 16_cmp89signedlatticel1totalsum_audit lake env lean YangMills/RG/BalabanCMP89SignedLatticeL1TotalSumAudit.lean
          run_stage 17_cmp89centeredgreenfouriersummability_focal lake build YangMills.RG.BalabanCMP89CenteredGreenFourierSummability
          run_stage 17_cmp89centeredgreenfouriersummability_audit lake env lean YangMills/RG/BalabanCMP89CenteredGreenFourierSummabilityAudit.lean
          run_stage 18_cmp99physicalgreenfinitegridaliasing_focal lake build YangMills.RG.BalabanCMP99PhysicalGreenFiniteGridAliasing
          run_stage 18_cmp99physicalgreenfinitegridaliasing_audit lake env lean YangMills/RG/BalabanCMP99PhysicalGreenFiniteGridAliasingAudit.lean

      - name: Verify 124 axiom blocks and package cold evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          expected = {
              '01_cmp89centeredbrillouinaffineslice_audit': 2,
              '02_cmp89centeredunitcubetorusquotient_audit': 20,
              '03_cmp89centeredtorusfourierphase_audit': 4,
              '04_cmp89normalizedbrillouintotorusmeasure_audit': 10,
              '05_cmp89eq248greenmassuniformholomorphy_audit': 11,
              '06_cmp89eq248displayedgreenvectorperiodicity_audit': 4,
              '07_cmp89eq248centeredgreentorus_audit': 8,
              '08_cmp99centeredtorussampledictionary_audit': 5,
              '09_cmp99centeredtorusphysicalgreensampletransport_audit': 5,
              '10_cmp89eq248greenonecoordinatecontourshift_audit': 1,
              '11_cmp89eq248greenproductcontourtelescope_audit': 5,
              '12_cmp89eq248massuniformgreenbound_audit': 12,
              '13_cmp89eq248massuniformnormalizedgreenbound_audit': 2,
              '14_cmp89centeredtorusgreencoefficientphase_audit': 5,
              '15_cmp89centeredtorusgreencoefficientdictionary_audit': 7,
              '16_cmp89signedlatticel1totalsum_audit': 13,
              '17_cmp89centeredgreenfouriersummability_audit': 5,
              '18_cmp99physicalgreenfinitegridaliasing_audit': 5,
          }
          focals = {
              '01_cmp89centeredbrillouinaffineslice_focal': 'YangMills/RG/BalabanCMP89CenteredBrillouinAffineSlice.lean',
              '02_cmp89centeredunitcubetorusquotient_focal': 'YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotient.lean',
              '03_cmp89centeredtorusfourierphase_focal': 'YangMills/RG/BalabanCMP89CenteredTorusFourierPhase.lean',
              '04_cmp89normalizedbrillouintotorusmeasure_focal': 'YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasure.lean',
              '05_cmp89eq248greenmassuniformholomorphy_focal': 'YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphy.lean',
              '06_cmp89eq248displayedgreenvectorperiodicity_focal': 'YangMills/RG/BalabanCMP89Eq248DisplayedGreenVectorPeriodicity.lean',
              '07_cmp89eq248centeredgreentorus_focal': 'YangMills/RG/BalabanCMP89Eq248CenteredGreenTorus.lean',
              '08_cmp99centeredtorussampledictionary_focal': 'YangMills/RG/BalabanCMP99CenteredTorusSampleDictionary.lean',
              '09_cmp99centeredtorusphysicalgreensampletransport_focal': 'YangMills/RG/BalabanCMP99CenteredTorusPhysicalGreenSampleTransport.lean',
              '10_cmp89eq248greenonecoordinatecontourshift_focal': 'YangMills/RG/BalabanCMP89Eq248GreenOneCoordinateContourShift.lean',
              '11_cmp89eq248greenproductcontourtelescope_focal': 'YangMills/RG/BalabanCMP89Eq248GreenProductContourTelescope.lean',
              '12_cmp89eq248massuniformgreenbound_focal': 'YangMills/RG/BalabanCMP89Eq248MassUniformGreenBound.lean',
              '13_cmp89eq248massuniformnormalizedgreenbound_focal': 'YangMills/RG/BalabanCMP89Eq248MassUniformNormalizedGreenBound.lean',
              '14_cmp89centeredtorusgreencoefficientphase_focal': 'YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientPhase.lean',
              '15_cmp89centeredtorusgreencoefficientdictionary_focal': 'YangMills/RG/BalabanCMP89CenteredTorusGreenCoefficientDictionary.lean',
              '16_cmp89signedlatticel1totalsum_focal': 'YangMills/RG/BalabanCMP89SignedLatticeL1TotalSum.lean',
              '17_cmp89centeredgreenfouriersummability_focal': 'YangMills/RG/BalabanCMP89CenteredGreenFourierSummability.lean',
              '18_cmp99physicalgreenfinitegridaliasing_focal': 'YangMills/RG/BalabanCMP99PhysicalGreenFiniteGridAliasing.lean',
          }
          for stage, module_path in focals.items():
              text = Path(f"evidence/{stage}.log").read_text(encoding="utf-8")
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              build = [line for line in lines if re.fullmatch(
                  r"Build completed successfully \(\d+ jobs\)\.", line
              )]
              if len(build) != 1 or lines[-1] != build[0]:
                  raise SystemExit(f"BAD_BUILD_SENTINEL={stage} count={len(build)}")
              if f"warning: {module_path}:" in text:
                  raise SystemExit(f"NEW_MODULE_LINTER_WARNING={stage}")
          parsed = {}
          total = 0
          for stage, count in expected.items():
              text = Path(f"evidence/{stage}.log").read_text(encoding="utf-8")
              compact = re.sub(r"\s+", "", text)
              for forbidden in ("sorryAx", "ofReduceBool"):
                  if forbidden in compact:
                      raise SystemExit(f"FORBIDDEN_AXIOM={forbidden} STAGE={stage}")
              blocks = re.findall(r"dependsonaxioms:\[([^\]]*)\]", compact)
              pure = compact.count("doesnotdependonanyaxioms")
              headers = len(blocks) + pure
              if headers != count:
                  raise SystemExit(
                      f"AXIOM_HEADER_COUNT={headers} EXPECTED={count} "
                      f"NONEMPTY={len(blocks)} EMPTY={pure} STAGE={stage}"
                  )
              values = []
              for body in blocks:
                  names = {item for item in body.split(",") if item}
                  if not names.issubset(allowed):
                      raise SystemExit(f"AXIOM_SET={sorted(names)} STAGE={stage}")
                  values.append(sorted(names))
              values.extend([[] for _ in range(pure)])
              parsed[stage] = values
              total += headers
          if total != 124:
              raise SystemExit(f"TOTAL_AXIOM_BLOCKS={total} EXPECTED=124")
          Path("evidence/axioms.json").write_text(
              json.dumps(parsed, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          printf 'FINAL_STATUS=PASS\n' | tee evidence/FINAL_STATUS
          sums="$(mktemp)"
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > "$sums"
          mv "$sums" evidence/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -cf - evidence | gzip -n > step8b23-ae-evidence.tar.gz
          sha256sum step8b23-ae-evidence.tar.gz | tee evidence/ARCHIVE_SHA256

      - name: Upload durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step8b23-ae-${{ env.SOURCE_SHA }}
          path: |
            evidence
            step8b23-ae-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14
