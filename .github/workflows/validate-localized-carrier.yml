name: Validate Gate-6 generated Green identification

on:
  workflow_dispatch:
    inputs:
      cold:
        description: Do not restore or save the diagnostic project graph
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_SHA: 3078a38a710dfdb735b5ecdde65d7a014b9c83ef
  SOURCE_BLOB_SHA256: 4223dca0923eb7b9682a6c16544a5552eb51b0e9195621b8371e75f791413868
  AUDIT_BLOB_SHA256: aece1c37a834af9d9afdc7ef58af0d11fc4dfef7bd3bf9934141f3cc5240475c
  EXPECTED_MATHLIB: 07642720480157414db592fa85b626dafb71355b
  TOOLCHAIN_URL: https://github.com/leanprover/lean4/releases/download/v4.29.0-rc6/lean-4.29.0-rc6-linux.tar.zst
  TOOLCHAIN_SHA256: bf3e0a4025e47a0bea9ed907d12dcccd3d3590b1d8ad6c55a915298b01ad9d3e
  PROJECT_RESTORE_PREFIXES: |
    gate6-generated-green-identification

jobs:
  gate6-generated-green-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact source checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          actual="$(git rev-parse HEAD)"
          printf 'SOURCE_SHA=%s\nACTUAL_HEAD=%s\nWORKFLOW_SHA=%s\n' \
            "$SOURCE_SHA" "$actual" "$GITHUB_SHA" | tee evidence/checkpoint.txt
          test "$actual" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.29.0-rc6"
          source_path=YangMills/RG/BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentification.lean
          audit_path=YangMills/RG/BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentificationAudit.lean
          test "$(git cat-file blob "$SOURCE_SHA:$source_path" | sha256sum | cut -d' ' -f1)" = "$SOURCE_BLOB_SHA256"
          test "$(git cat-file blob "$SOURCE_SHA:$audit_path" | sha256sum | cut -d' ' -f1)" = "$AUDIT_BLOB_SHA256"

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          asset=/tmp/lean-4.29.0-rc6-linux.tar.zst
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$asset" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$TOOLCHAIN_SHA256" "$asset" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p /tmp/lean-toolchain
          tar --use-compress-program=unzstd -xf "$asset" -C /tmp/lean-toolchain
          bindir=/tmp/lean-toolchain/lean-4.29.0-rc6-linux/bin
          test -x "$bindir/lean"
          test -x "$bindir/lake"
          echo "$bindir" >> "$GITHUB_PATH"
          {
            printf 'TOOLCHAIN_URL=%s\nTOOLCHAIN_ASSET_SHA256=%s\n' \
              "$TOOLCHAIN_URL" "$TOOLCHAIN_SHA256"
            sha256sum "$bindir/lean" "$bindir/lake"
          } | tee evidence/toolchain.txt

      - name: Verify cache-key budget
        id: cache-keys
        shell: bash
        run: |
          mapfile -t prefixes < <(printf '%s\n' "$PROJECT_RESTORE_PREFIXES" | sed '/^[[:space:]]*$/d')
          total_count="$((1 + ${#prefixes[@]}))"
          printf 'CACHE_KEY_COUNT=%s\n' "$total_count"
          test "$total_count" -le 10
          {
            printf 'keys<<EOF\n'
            for prefix in "${prefixes[@]}"; do
              printf 'hRpoly-%s-%s-%s-\n' "$prefix" "$RUNNER_OS" "$EXPECTED_MATHLIB"
            done
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Restore diagnostic project graph
        if: ${{ inputs.cold == false }}
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: hRpoly-gate6-generated-green-identification-${{ runner.os }}-${{ env.EXPECTED_MATHLIB }}-${{ env.SOURCE_SHA }}
          restore-keys: ${{ steps.cache-keys.outputs.keys }}

      - name: Record diagnostic cache state
        shell: bash
        run: |
          printf 'COLD_MODE=%s\nPROJECT_CACHE_HIT=%s\nPROJECT_CACHE_PRIMARY_KEY=%s\nPROJECT_CACHE_MATCHED_KEY=%s\n' \
            '${{ inputs.cold }}' \
            '${{ steps.project-cache.outputs.cache-hit }}' \
            '${{ steps.project-cache.outputs.cache-primary-key }}' \
            '${{ steps.project-cache.outputs.cache-matched-key }}' | \
            tee evidence/project-cache.txt

      - name: Materialize pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee -a evidence/toolchain.txt
          lake --version | tee -a evidence/toolchain.txt
          manifest_before="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          toolchain_before="$(sha256sum lean-toolchain | cut -d' ' -f1)"
          lake update 2>&1 | tee evidence/lake-update.log
          test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "$manifest_before"
          test "$(sha256sum lean-toolchain | cut -d' ' -f1)" = "$toolchain_before"
          mathlib="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          printf 'MATHLIB_SHA=%s\n' "$mathlib" | tee evidence/mathlib.txt
          test "$mathlib" = "$EXPECTED_MATHLIB"
          lake exe cache get 2>&1 | tee evidence/cache-get.log

      - name: Run focal queue stop on first error
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            YangMills/RG/BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentification.lean \
            YangMills/RG/BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentificationAudit.lean \
            > evidence/overlay-paths.txt
          python scripts/check_lean_overlay_text.py \
            --paths-from evidence/overlay-paths.txt | tee evidence/text-guard.log
          run_stage() {
            local stage="$1"
            shift
            local started ended code
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'STAGE=%s STARTED=%s CMD=' "$stage" "$started" | tee -a evidence/stages.txt
            printf '%q ' "$@" | tee -a evidence/stages.txt
            printf '\n' | tee -a evidence/stages.txt
            set +e
            "$@" 2>&1 | tee "evidence/${stage}.log"
            code=${PIPESTATUS[0]}
            set -e
            ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'STAGE=%s EXIT=%s ENDED=%s\n' "$stage" "$code" "$ended" | \
              tee -a evidence/stages.txt
            test "$code" -eq 0
          }

          run_stage generated_green_identification_focal \
            lake build YangMills.RG.BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentification
          run_stage generated_green_identification_audit \
            lake env lean YangMills/RG/BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentificationAudit.lean

      - name: Verify axiom gates and package cold evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          audits = {
              "generated_green_identification_audit.log": 4,
          }
          focals = {
              "generated_green_identification_focal.log":
                  "BalabanCMP99SourceGeneratedFlatPhysicalGreenIdentification.lean:",
          }
          for name, source_name in focals.items():
              focal = (Path("evidence") / name).read_text(encoding="utf-8")
              if f"warning: YangMills/RG/{source_name}" in focal:
                  raise SystemExit(f"NEW_MODULE_LINTER_WARNING FILE={name}")
          result = {}
          for name, expected in audits.items():
              text = (Path("evidence") / name).read_text(encoding="utf-8")
              compact = re.sub(r"\s+", "", text)
              for forbidden in ("sorryAx", "ofReduceBool"):
                  if forbidden in compact:
                      raise SystemExit(f"FORBIDDEN_AXIOM={forbidden} FILE={name}")
              blocks = re.findall(r"dependsonaxioms:\[([^\]]*)\]", compact)
              if len(blocks) != expected:
                  raise SystemExit(
                      f"AXIOM_BLOCK_COUNT={len(blocks)} EXPECTED={expected} FILE={name}"
                  )
              parsed = []
              for body in blocks:
                  names = {item for item in body.split(",") if item}
                  if not names.issubset(allowed):
                      raise SystemExit(f"AXIOM_SET={sorted(names)} FILE={name}")
                  parsed.append(sorted(names))
              result[name] = parsed
          (Path("evidence") / "axioms.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          printf 'FINAL_STATUS=PASS\n' | tee evidence/FINAL_STATUS
          sums="$(mktemp)"
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > "$sums"
          mv "$sums" evidence/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -cf - evidence | gzip -n > \
              gate6-generated-green-identification-evidence.tar.gz
          sha256sum gate6-generated-green-identification-evidence.tar.gz | tee evidence/ARCHIVE_SHA256

      - name: Upload durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate6-generated-green-identification-${{ env.SOURCE_SHA }}
          path: |
            evidence
            gate6-generated-green-identification-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Save diagnostic project graph
        if: ${{ always() && inputs.cold == false && steps.project-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: hRpoly-gate6-generated-green-identification-${{ runner.os }}-${{ env.EXPECTED_MATHLIB }}-${{ env.SOURCE_SHA }}
