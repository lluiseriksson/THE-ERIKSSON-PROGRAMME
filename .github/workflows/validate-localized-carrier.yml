name: Validate source-flow uniform and localized B0

on:
  workflow_dispatch:
    inputs:
      cold:
        description: Require a cold checkout without project-graph restoration
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SOURCE_SHA: 73bb1a2008c557840a91e50d8abe6b874947f7ee
  EXPECTED_MATHLIB: 07642720480157414db592fa85b626dafb71355b
  TOOLCHAIN_URL: https://github.com/leanprover/lean4/releases/download/v4.29.0-rc6/lean-4.29.0-rc6-linux.tar.zst
  TOOLCHAIN_SHA256: bf3e0a4025e47a0bea9ed907d12dcccd3d3590b1d8ad6c55a915298b01ad9d3e

jobs:
  source-flow-uniform-localized-b0:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require cold terminal mode
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.cold }}' = 'true'

      - name: Checkout exact control checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control

      - name: Checkout immutable mathematical source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          path: source

      - name: Verify checkpoints and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          control_head="$(git -C control rev-parse HEAD)"
          source_head="$(git -C source rev-parse HEAD)"
          printf 'SOURCE_SHA=%s\nACTUAL_SOURCE_HEAD=%s\nCONTROL_SHA=%s\nGITHUB_SHA=%s\nCOLD_MODE=%s\n' \
            "$SOURCE_SHA" "$source_head" "$control_head" "$GITHUB_SHA" \
            '${{ inputs.cold }}' | tee evidence/checkpoint.txt
          test "$control_head" = "$GITHUB_SHA"
          test "$source_head" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/lean-toolchain)" = \
            'leanprover/lean4:v4.29.0-rc6'
          printf '%s  %s\n' \
            8c1c1099dd5043a518df4a89b888548f894b9152a9e3fc85ecec3c9109a5d21e \
            source/YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalUniformPointSourceB0.lean \
            | sha256sum -c -
          printf '%s  %s\n' \
            743a914fd19d68a7aaeecaf61fee2c54e60a2c92ebb96f7d6851fcba37ca954d \
            source/YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalUniformPointSourceB0Audit.lean \
            | sha256sum -c -
          printf '%s  %s\n' \
            c083ff9c5693c8e3d35d9b6d7d58d7a0d2e95fd73b443401b9c19dcbf79109b1 \
            source/YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalLocalizedFieldB0.lean \
            | sha256sum -c -
          printf '%s  %s\n' \
            377312d8a20be16f45434c7a70ecd32516fb5158032cfc50d1e18aa7a92d8bcb \
            source/YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalLocalizedFieldB0Audit.lean \
            | sha256sum -c -

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          asset=/tmp/lean-4.29.0-rc6-linux.tar.zst
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$asset" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$TOOLCHAIN_SHA256" "$asset" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p /tmp/lean-toolchain
          tar --use-compress-program=unzstd -xf "$asset" -C /tmp/lean-toolchain
          bindir=/tmp/lean-toolchain/lean-4.29.0-rc6-linux/bin
          test -x "$bindir/lean"
          test -x "$bindir/lake"
          echo "$bindir" >> "$GITHUB_PATH"
          {
            printf 'TOOLCHAIN_URL=%s\nTOOLCHAIN_ASSET_SHA256=%s\n' \
              "$TOOLCHAIN_URL" "$TOOLCHAIN_SHA256"
            sha256sum "$bindir/lean" "$bindir/lake"
          } | tee evidence/toolchain.txt

      - name: Materialize pinned dependencies
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          lean --version | tee -a ../evidence/toolchain.txt
          lake --version | tee -a ../evidence/toolchain.txt
          manifest_before="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          toolchain_before="$(sha256sum lean-toolchain | cut -d' ' -f1)"
          lake update 2>&1 | tee ../evidence/lake-update.log
          test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "$manifest_before"
          test "$(sha256sum lean-toolchain | cut -d' ' -f1)" = "$toolchain_before"
          mathlib="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          printf 'MATHLIB_SHA=%s\n' "$mathlib" | tee ../evidence/mathlib.txt
          test "$mathlib" = "$EXPECTED_MATHLIB"
          lake exe cache get 2>&1 | tee ../evidence/cache-get.log

      - name: Run uniform B0 focal
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          lake build YangMills.RG.BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalUniformPointSourceB0 \
            2>&1 | tee ../evidence/focal.log
          focal_exit=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - start))
          printf 'stage=source_flow_uniform_point_source_b0_focal exit=%s seconds=%s\n' \
            "$focal_exit" "$elapsed" | tee ../evidence/focal.status
          test "$focal_exit" -eq 0

      - name: Run uniform B0 audit and exact axiom gate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          lake env lean \
            YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalUniformPointSourceB0Audit.lean \
            2>&1 | tee ../evidence/uniform-audit.log
          audit_exit=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - start))
          printf 'stage=source_flow_uniform_point_source_b0_audit exit=%s seconds=%s\n' \
            "$audit_exit" "$elapsed" | tee ../evidence/uniform-audit.status
          test "$audit_exit" -eq 0
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('../evidence/uniform-audit.log').read_text(encoding='utf-8')
          blocks = re.findall(r"depends on axioms:\s*\[(.*?)\]", text, re.S)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if len(blocks) != 5:
              raise SystemExit(f'AXIOM_HEADER_COUNT_MISMATCH expected=5 actual={len(blocks)}')
          normalized = []
          for index, block in enumerate(blocks, start=1):
              names = {item.strip() for item in block.split(',') if item.strip()}
              unexpected = names - allowed
              if unexpected:
                  raise SystemExit(
                      f'AXIOM_GATE_FAILED block={index} unexpected={sorted(unexpected)}'
                  )
              normalized.append(f"uniform_axiom_block_{index}=" + ','.join(sorted(names)))
          Path('../evidence/uniform-axioms.txt').write_text(
              '\n'.join(normalized) + '\n', encoding='utf-8'
          )
          print('\n'.join(normalized))
          PY

      - name: Run localized-field B0 focal
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          lake build YangMills.RG.BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalLocalizedFieldB0 \
            2>&1 | tee ../evidence/localized-focal.log
          focal_exit=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - start))
          printf 'stage=source_flow_localized_field_b0_focal exit=%s seconds=%s\n' \
            "$focal_exit" "$elapsed" | tee ../evidence/localized-focal.status
          test "$focal_exit" -eq 0

      - name: Run localized-field B0 audit and exact axiom gate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          lake env lean \
            YangMills/RG/BalabanCMP99SourceSeparatedSourceFlowFlatPhysicalLocalizedFieldB0Audit.lean \
            2>&1 | tee ../evidence/localized-audit.log
          audit_exit=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - start))
          printf 'stage=source_flow_localized_field_b0_audit exit=%s seconds=%s\n' \
            "$audit_exit" "$elapsed" | tee ../evidence/localized-audit.status
          test "$audit_exit" -eq 0
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('../evidence/localized-audit.log').read_text(encoding='utf-8')
          blocks = re.findall(r"depends on axioms:\s*\[(.*?)\]", text, re.S)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if len(blocks) != 2:
              raise SystemExit(f'AXIOM_HEADER_COUNT_MISMATCH expected=2 actual={len(blocks)}')
          normalized = []
          for index, block in enumerate(blocks, start=1):
              names = {item.strip() for item in block.split(',') if item.strip()}
              unexpected = names - allowed
              if unexpected:
                  raise SystemExit(
                      f'AXIOM_GATE_FAILED block={index} unexpected={sorted(unexpected)}'
                  )
              normalized.append(f"localized_axiom_block_{index}=" + ','.join(sorted(names)))
          Path('../evidence/localized-axioms.txt').write_text(
              '\n'.join(normalized) + '\n', encoding='utf-8'
          )
          print('\n'.join(normalized))
          PY
          printf 'FINAL_STATUS=PASS\n' > ../evidence/FINAL_STATUS

      - name: Package deterministic cold evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f evidence/FINAL_STATUS; then
            printf 'FINAL_STATUS=FAIL_OR_INCOMPLETE\n' > evidence/FINAL_STATUS
          fi
          sums="$(mktemp)"
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > "$sums"
          mv "$sums" evidence/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -cf - evidence | gzip -n \
            > source-flow-uniform-localized-b0-evidence.tar.gz
          sha256sum source-flow-uniform-localized-b0-evidence.tar.gz \
            | tee evidence/ARCHIVE_SHA256

      - name: Upload durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-flow-uniform-localized-b0-${{ env.SOURCE_SHA }}
          path: |
            evidence
            source-flow-uniform-localized-b0-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14
