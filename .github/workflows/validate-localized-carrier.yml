name: Validate Step 8b.23 Unit F

on:
  workflow_dispatch:
    inputs:
      cold:
        description: Require a cold checkout without project-graph restoration
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SOURCE_SHA: 48bf91700168d00b8cdf38998fff354d7f4634cf
  EXPECTED_MATHLIB: 07642720480157414db592fa85b626dafb71355b
  TOOLCHAIN_URL: https://github.com/leanprover/lean4/releases/download/v4.29.0-rc6/lean-4.29.0-rc6-linux.tar.zst
  TOOLCHAIN_SHA256: bf3e0a4025e47a0bea9ed907d12dcccd3d3590b1d8ad6c55a915298b01ad9d3e

jobs:
  step8b23-f:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require cold terminal mode
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.cold }}' = 'true'

      - name: Checkout exact source checkpoint
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact source checkpoint and 44 blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          actual="$(git rev-parse HEAD)"
          printf 'SOURCE_SHA=%s\nACTUAL_HEAD=%s\nWORKFLOW_SHA=%s\nCOLD_MODE=%s\n' \
            "$SOURCE_SHA" "$actual" "$GITHUB_SHA" '${{ inputs.cold }}' | \
            tee evidence/checkpoint.txt
          test "$actual" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.29.0-rc6"
          cat > evidence/source-blobs.sha256 <<'SOURCE_BLOBS'
          7887b8583da2f189ac0af22a39f3f401300612c35149571553cff2135b75fbf4  YangMills/RG/BalabanCMP89CenteredBrillouinAffineSlice.lean
          2d22ba868fcd5c3262a105163aea87b159f3215dd6acb63920a041e3ddae5adb  YangMills/RG/BalabanCMP89CenteredBrillouinAffineSliceAudit.lean
          a02095bfd4ae48fa3ea583ebf472af4e1a1d54ed61a8f07f4f9290278d083624  YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotient.lean
          c475e75ea70836d9a31f993935a3cbef0ba099ec3daf3bd17bea0268b0bc86bd  YangMills/RG/BalabanCMP89CenteredUnitCubeTorusQuotientAudit.lean
          ac0b42198859f258966c22bd480dcb4d3d7762aa6692256f261626ecce2aa412  YangMills/RG/BalabanCMP89CenteredTorusFourierPhase.lean
          438c63d9d86fff3f4dda819340624dfb71003a9d2111eba2a088153b34262c76  YangMills/RG/BalabanCMP89CenteredTorusFourierPhaseAudit.lean
          445d2a8ed04f2d86da8ff733ecbea592fc8e570c429655a2c8d95937b531528b  YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasure.lean
          b3613418139528c719c2bd92541aaddddc14bc7758e012093c7e4c6abe511166  YangMills/RG/BalabanCMP89NormalizedBrillouinToTorusMeasureAudit.lean
          b5661f61903649b7e3abdcec12be706b432b776ea681c0cd979301bb21253fc2  YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphy.lean
          3d6ac7652107884440ab52a62b6001ce14a09eb1af0d5400c86ade6589821da5  YangMills/RG/BalabanCMP89Eq248GreenMassUniformHolomorphyAudit.lean
