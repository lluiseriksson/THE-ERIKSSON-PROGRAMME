name: CI – Epistemic Honesty Enforcement

# HONEST SCOPE STATEMENT
# ----------------------
# This job is a TEXTUAL scan and compiles no Lean.  Compilation is done by
# .github/workflows/lean-build.yml (`lake build YangMillsCore` against the
# pinned toolchain and Mathlib cache, plus the `oracle_check.lean` axiom
# oracle); its recorded job count lives in project-state.json, and dated
# build/oracle records are in docs/VERIFICATION-LEDGER.md.
#
# What this job enforces, on every push and PR:
#   1. zero `sorry` in the proof tree (comment-aware Python scanner);
#   2. zero `axiom` declarations inside the verified-core source tree
#      (including the clean `YangMills/RG` layer).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zero sorry (proof tree) + zero axioms (verified-core tree)
        # Comment-aware scanner; the core dirs/files are listed in the script.
        run: python scripts/check_consistency.py
